server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cần thiết để trình duyệt nhận diện CSS/JS
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Allow large file uploads
    client_max_body_size 50m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 1. Swagger / docs
    location /nexus/docs {
        proxy_pass http://backend:8080/nexus/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /nexus/openapi.json {
        proxy_pass http://backend:8080/nexus/openapi.json;
        proxy_set_header Host $host;
    }

    # 2. API proxy
    location /nexus/api/ {
        proxy_pass http://backend:8080/nexus/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 3. Static files backend
    location /nexus/static/ {
        proxy_pass http://backend:8080/nexus/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Phục vụ assets và HTML bằng alias (chuẩn nhất cho subfolder)
    location /nexus/assets/ {
        alias /usr/share/nginx/html/nexus/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    location /nexus/ {
        alias /usr/share/nginx/html/nexus/;
        index index.html;
        try_files $uri $uri/ /nexus/index.html;
        add_header Access-Control-Allow-Origin *;
    }

    # Redirect root -> /nexus/
    location = / {
        return 301 /nexus/;
    }
}
