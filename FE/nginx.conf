map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 2010;
    server_name localhost;

    # Gốc của web server
    root /usr/share/nginx/html;

    # Cấu hình cho đường dẫn /style/
    location /style/ {
        index index.html index.htm;
        try_files $uri $uri/ /style/index.html;

        # Bảo mật header theo yêu cầu
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self';" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Hỗ trợ asset files
    location ~* ^/style/(.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2))$ {
        try_files $uri =404;
    }

    # Proxy API requests to the Backend container
    location ^~ /style/api {
        proxy_pass http://backend:2000/api;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Headers cho WebSockets nếu cần (Upgrade/Connection)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        # Xóa các header cũ để tránh ghi đè sai
        proxy_hide_header X-Frame-Options;
    }

    # Proxy uploads for image retrieval from the Backend
    location ^~ /style/uploads/ {
        proxy_pass http://backend:2000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket requests (Sử dụng đường dẫn cụ thể)
    location /style/ws-chat {
        proxy_pass http://backend:2000/ws-chat;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
